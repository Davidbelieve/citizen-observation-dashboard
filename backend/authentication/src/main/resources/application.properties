# Application Configuration
spring.application.name=carbon-intensity-dashboard
server.port=8080

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:carbondashboard
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for viewing database)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=carbonDashboardSecretKeyForJWTTokenGenerationAndValidation12345
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.carbon.dashboard=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always