spring.application.name=reward

server.port=8092

# spring datasource
spring.datasource.url=jdbc:sqlite:data/reward.db
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# spring jpa
spring.jpa.hibernate.ddl-auto=update

reward.crowdsourced.base-url=http://localhost:8091
reward.crowdsourced.page-size=100


# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# management endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# logging levels
logging.level.com.waterQualityMonitoring.reward=INFO
logging.level.org.springframework.web=INFO
