spring.cloud.config.enabled=false
spring.main.web-application-type=reactive

resilience4j.circuitbreaker.instances.crowdsourced-circuit-breaker.minimum-number-of-calls=1
resilience4j.circuitbreaker.instances.crowdsourced-circuit-breaker.sliding-window-size=1
resilience4j.circuitbreaker.instances.crowdsourced-circuit-breaker.sliding-window-type=count-based
resilience4j.circuitbreaker.instances.crowdsourced-circuit-breaker.wait-duration-in-open-state=100ms

resilience4j.circuitbreaker.instances.reward-circuit-breaker.minimum-number-of-calls=1
resilience4j.circuitbreaker.instances.reward-circuit-breaker.sliding-window-size=1
resilience4j.circuitbreaker.instances.reward-circuit-breaker.sliding-window-type=count-based
resilience4j.circuitbreaker.instances.reward-circuit-breaker.wait-duration-in-open-state=100ms

resilience4j.circuitbreaker.instances.actuatorCircuitBreaker.minimum-number-of-calls=1
resilience4j.circuitbreaker.instances.actuatorCircuitBreaker.sliding-window-size=1
resilience4j.circuitbreaker.instances.actuatorCircuitBreaker.sliding-window-type=count-based
resilience4j.circuitbreaker.instances.actuatorCircuitBreaker.wait-duration-in-open-state=100ms

